# ===== Paths =====
paths:
  data_dir: ./data/EuroSAT_RGB  # root containing class subfolders or images
  output_dir: ./outputs
  tb_log_dir: ./outputs/tensorboard
  ckpt_dir: ./outputs/checkpoints
  miscls_dir: ./outputs/misclassified

# ===== Data =====
data:
  img_size: 224               # resize/center-crop target
  batch_size: 64
  num_workers: 4
  pin_memory: true
  stratify: true
  val_size: 0.15
  test_size: 0.0              # optional external test split
  class_imbalance: weighted_sampler  # [none|weighted_sampler|class_weights]

# ===== Augmentations =====
aug:
  train:
    # albumentations keys (applied after basic resize)
    - name: RandomResizedCrop
      params: {size: [224,224], scale: [0.8, 1.0], ratio: [0.75, 1.33], interpolation: 1}
    - name: HorizontalFlip
      params: {p: 0.5}
    - name: RandomBrightnessContrast
      params: {p: 0.2}
    - name: HueSaturationValue
      params: {p: 0.2}
    - name: GaussNoise
      params: {p: 0.15}
  val:
    - name: Resize
      params: {height: 256, width: 256}
    - name: CenterCrop
      params: {height: 224, width: 224}
# ===== Model =====
model:
  #arch: swin_base_patch4_window7_224  # or convnext_base.fb_in22k_ft_in1k
  arch: convnext_base.fb_in22k_ft_in1k
  pretrained: true
  num_classes: 10
  compile: false

# ===== Optim & Loss =====
optim:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

loss:
  name: cross_entropy           # [cross_entropy|focal|soft_dice|lovasz_softmax]
  focal_gamma: 2.0
  class_weights: auto           # [auto|null|list] used when class_imbalance: class_weights

# ===== Scheduler =====
scheduler:
  name: cosine                   # [cosine|reduce_on_plateau|none]
  cosine:
    T_max: 20
    eta_min: 1.0e-6
  reduce_on_plateau:
    factor: 0.5
    patience: 3
    min_lr: 1.0e-6

# ===== Training =====
train:
  epochs: 50
  mixed_precision: true
  early_stopping:
    monitor: val_loss
    patience: 5
    min_delta: 0.0
  checkpoint:
    monitor: val_acc
    mode: max
  grad_clip_norm: 1.0
  seed: 42
  ddp:
    enabled: false
    backend: nccl
    find_unused_parameters: false

# ===== TTA =====
tta:
  enabled: true
  transforms: [hflip, vflip]   # simple example